name: Gerar vídeos políticos

on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * *'
    - cron: '0 22 * * *'

jobs:
  gerar-video:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        shell: powershell
        run: |
          pip install -r requirements.txt
          pip install edge-tts

      - name: Verificar ambiente
        shell: powershell
        run: |
          python --version
          ffmpeg -version

      - name: Limpar cache de notícias
        shell: powershell
        run: |
          if (Test-Path "noticias_vistas.json") {
            Remove-Item "noticias_vistas.json" -Force
          }

      - name: Rodar pipeline
        shell: powershell
        run: |
          python pipeline.py

      - name: Upload artefatos
        uses: actions/upload-artifact@v4
        with:
          name: saida-video-${{ github.run_id }}
          path: |
            videos_gerados/
            roteiro_gerado.json
            audio.mp3
            audio.srt
            noticias_vistas.json
          if-no-files-found: warn