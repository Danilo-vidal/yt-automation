stages:
  - generate

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR\\.pip-cache"
  PYTHONUNBUFFERED: "1"

generate_news_video:
  stage: generate
  tags:
    - windows
  before_script:
    - Write-Host "Iniciando job no runner Windows"
    - python --version
    - pip --version
    - ffmpeg -version
    - pip install -r requirements.txt
  script:
    - Write-Host "Limpando cache de notícias"
    - if (Test-Path ".\noticias_vistas.json") { Remove-Item ".\noticias_vistas.json" -Force }
    - Write-Host "Executando pipeline"
    - python pipeline.py
  after_script:
    - Write-Host "Listando saída gerada"
    - if (Test-Path ".\videos_gerados") { Get-ChildItem ".\videos_gerados" }
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - videos_gerados/
      - roteiro_gerado.json
      - audio.mp3
      - audio.srt
      - noticias_vistas.json