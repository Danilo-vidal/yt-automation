name: Gerar vídeos políticos

on:
  workflow_dispatch:

  schedule:
    - cron: '0 12 * * *'
      timezone: 'America/Sao_Paulo'
    - cron: '0 19 * * *'
      timezone: 'America/Sao_Paulo'

jobs:
  gerar-video:
    runs-on: [self-hosted, windows]

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verificar Python
        shell: powershell
        run: |
          python --version
          pip --version

      - name: Verificar FFmpeg
        shell: powershell
        run: |
          ffmpeg -version

      - name: Instalar dependências
        shell: powershell
        run: |
          pip install -r requirements.txt
          pip install edge-tts

      - name: Limpar cache de notícias
        shell: powershell
        run: |
          if (Test-Path ".\noticias_vistas.json") {
            Remove-Item ".\noticias_vistas.json" -Force
          }

      - name: Rodar pipeline
        shell: powershell
        run: |
          python pipeline.py

      - name: Enviar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: saida-video-${{ github.run_id }}
          path: |
            videos_gerados/
            roteiro_gerado.json
            audio.mp3
            audio.srt
            noticias_vistas.json
          if-no-files-found: warn